name: With-Actions
on:
 workflow_dispatch:
jobs:
  manual-setup:
      runs-on: ubuntu-latest
      steps:
      - name: Automation of cloning the repo
        run: |
         echo "cloning"
         git clone https://github.com/${{ github.repository }}.git .
          echo "list of files after cloning"
         ls -la  
         echo "========================"
         echo "Working directory"
         pwd
      - name: Verifying Java Software
        run: |
         echo "Java Version"
         java -version
