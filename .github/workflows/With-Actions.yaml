name: With-Actions
on:
 workflow_dispatch:
jobs:
  manual-setup:
      runs-on: ubuntu-latest
      steps:
      - name: Check out the repo
        run: actions/checkout@v3
      - name: Verifying Java Software
        run: |
         echo "Java Version"
         java -version
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
         
